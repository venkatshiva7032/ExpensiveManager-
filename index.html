<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-100 to-purple-100 min-h-screen">

    <div class="max-w-3xl mx-auto p-8 bg-white shadow-2xl rounded-2xl mt-10">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
            Smart Expense Manager
        </h1>

        <form id="expenseForm" class="space-y-5">

            <div>
                <label for="amount" class="block mb-1 font-semibold text-gray-700">Amount</label>
                <input type="number" id="amount" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                <p id="amountError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <div>
                <label for="category" class="block mb-1 font-semibold text-gray-700">Category</label>
                <select id="category" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="">Select Category</option>
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Bills</option>
                </select>
            </div>

            <div>
                <label for="date" class="block mb-1 font-semibold text-gray-700">Date</label>
                <input type="date" id="date" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div>
                <label class="block mb-1 font-semibold text-gray-700">Payment Mode</label>
                <label class="mr-4">
                    <input type="radio" name="payment" value="Cash"> Cash
                </label>
                <label>
                    <input type="radio" name="payment" value="Card"> Card
                </label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 transition text-white px-4 py-2 rounded-lg font-semibold">
                Add Expense
            </button>

        </form>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-8">

            <div class="bg-green-50 p-4 rounded-lg shadow">
                <p id="foodTotal" class="font-semibold text-green-700">
                    Food Total: ₹0
                </p>
            </div>

            <div class="bg-yellow-50 p-4 rounded-lg shadow">
                <p id="travelTotal" class="font-semibold text-yellow-700">
                    Travel Total: ₹0
                </p>
            </div>

            <div class="bg-red-50 p-4 rounded-lg shadow">
                <p id="billsTotal" class="font-semibold text-red-700">
                    Bills Total: ₹0
                </p>
            </div>

            <div class="bg-blue-50 p-4 rounded-lg shadow">
                <p id="totalAmount" class="font-semibold text-blue-700">
                    Total Amount: ₹0
                </p>
                <p id="totalCount" class="font-semibold text-blue-700 mt-2">
                    Total Transactions: 0
                </p>
            </div>

        </div>

        <div id="expenseContainer" class="mt-8 space-y-4 grid grid-cols-2"></div>

    </div>

    <script src="script.js"></script>
</body>

</html>
